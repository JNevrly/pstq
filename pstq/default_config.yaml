general:
    log_level: INFO  # Logging level [DEBUG, INFO, WARNING, ERROR, CRITICAL]

archive:
    pst_path:
        oc_default: null
        oc_schema:
            type: string
            nullable: true
    index_path:
        oc_default: null
        oc_schema:
            type: string
            nullable: true
history:
    # Exact aliases identifying the archive owner in quoted message headers.
    owner_emails:
        oc_default: []
        oc_schema:
            type: list
            schema:
                type: string
    owner_names:
        oc_default: []
        oc_schema:
            type: list
            schema:
                type: string
    # IANA timezone applied to quoted Outlook timestamps without an offset.
    timezone:
        oc_default: UTC
        oc_schema:
            type: string
